name: PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test reply storage
        run: python3 -m unittest discover -s tests -v

      - name: Check Python syntax
        run: python3 -m py_compile bot.py storage.py import_replies.py

      - name: Validate Docker build
        run: docker build --pull --tag voxelpluginbot:pr .
